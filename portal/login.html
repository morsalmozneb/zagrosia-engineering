<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Portal — Zagrosia Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0052A5;
    --navy-dark: #003d7a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F7F9FC;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #1f2a33;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10), 0 1px 4px rgba(0,0,0,0.06);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
  }
  .card-top {
    padding: 36px 40px 0 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card-top img {
    height: 44px;
    width: auto;
    display: block;
  }
  .divider {
    width: 100%;
    height: 2px;
    background: var(--navy);
    margin-top: 20px;
    border-radius: 1px;
  }
  .card-body {
    padding: 28px 40px 36px 40px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #1f2a33;
    margin-bottom: 6px;
    text-align: center;
  }
  .subtitle {
    font-size: 14px;
    color: #5b6b78;
    text-align: center;
    margin-bottom: 28px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 16px;
  }
  .form-group label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #5b6b78;
  }
  .form-group input {
    border: 1.5px solid #c9d4dd;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 15px;
    font-family: inherit;
    color: #1f2a33;
    background: #fff;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    outline: none;
    width: 100%;
  }
  .form-group input:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(0, 82, 165, 0.12);
  }
  .error-msg {
    display: none;
    background: #fdf0ef;
    border: 1px solid #f1c0bc;
    color: #c0392b;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .btn-signin {
    width: 100%;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .btn-signin:hover:not(:disabled) { background: var(--navy-dark); }
  .btn-signin:disabled { opacity: 0.65; cursor: not-allowed; }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: #8a9baa;
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-top">
    <img src="./public/images/Sidebar-Logo-Open.png" alt="Zagrosia Engineering Inc.">
    <div class="divider"></div>
  </div>
  <div class="card-body">
    <h1>Employee Portal</h1>
    <p class="subtitle">Sign in with your Zagrosia email</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@zagrosia.ca" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-signin" id="signInBtn">Sign In</button>
    </form>
  </div>
</div>

<footer>© 2026 Zagrosia Engineering Inc.</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://jftemrpvbwfwmztccpon.supabase.co', 'sb_publishable_Fpit6hpvuwHxb0YlbjAH5g_aj7QGlDI')

// On page load: if already logged in, redirect to timesheet.html
window.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await supabase.auth.getSession()
  if (session) window.location.href = 'timesheet.html'
})

// On form submit:
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault()
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const btn = document.getElementById('signInBtn')
  const errDiv = document.getElementById('errorMsg')

  btn.disabled = true
  btn.textContent = 'Signing in...'
  errDiv.style.display = 'none'

  const { error } = await supabase.auth.signInWithPassword({ email, password })

  if (error) {
    errDiv.textContent = 'Invalid email or password. Please try again.'
    errDiv.style.display = 'block'
    btn.disabled = false
    btn.textContent = 'Sign In'
  } else {
    window.location.href = 'timesheet.html'
  }
})
</script>

</body>
</html>
